<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <title>Roma Shuliatiev — Product Designer</title>

    <!-- Icons -->
    <link rel="icon" href="/favicon-48.png" type="image/png" />

    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Primary meta -->
    <meta
      name="description"
      content="Product Designer based in Kyiv. Open to product design roles." />
    <meta name="theme-color" content="#F55817" />

    <!-- PWA / Apple -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-status-bar-style" content="black" />
    <meta
      name="mobile-web-app-title"
      content="Roma Shuliatiev — Product Designer" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://romamakes.com/" />
    <meta property="og:title" content="Roma Shuliatiev — Product Designer" />
    <meta
      property="og:description"
      content="Product Designer based in Kyiv. Open to product design roles." />
    <meta
      property="og:image"
      content="https://romamakes.com/images/social.png" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://romamakes.com/" />
    <meta name="twitter:title" content="Roma Shuliatiev — Product Designer" />
    <meta
      name="twitter:description"
      content="Product Designer based in Kyiv. Open to product design roles." />
    <meta
      name="twitter:image"
      content="https://romamakes.com/images/social.png" />
  </head>

  <body>
    <script>
      (function () {
        var saved;
        try {
          saved = localStorage.getItem('theme');
        } catch (e) {}
        var isDark = saved === 'dark' ||
          (saved !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (isDark) document.documentElement.classList.add('dark');
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
